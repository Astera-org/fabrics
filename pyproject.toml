[project]
name = "fabrics"
version = "0.10.0"
description = "Optimization fabrics in python."
authors = [
    { name = "Max Spahn", email = "m.spahn@tudelft.nl" },
]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<4.0"
keywords = ["robotics", "motion-planning", "geometry"]
dependencies = [
    "casadi>=3.5.5",
    "deprecation>=2.1.0,<3.0.0",
    "forwardkinematics>=1.2.2,<2.0.0",
    "geomdl>=5.3.1,<6.0.0",
    "mpscenes>=0.4,<0.5",
    "numpy>=1.15.3,<2.0.0",
    "pickle-mixin>=1.0.2,<2.0.0",
    "pynput>=1.7.6,<2.0.0",
    "pyquaternion>=0.9.9,<0.10.0",
    "quaternionic>=1.0.0,<2.0.0",
    "vector>=1.1.1,<2.0.0",
]

[project.urls]
Repository = "https://tud-amr/fabrics"

[dependency-groups]
agents = [
    "planarenvs>=1.5.1,<2.0.0",
    "urdfenvs @ git+https://github.com/maxspahn/gym_envs_urdf.git@develop",
]
dev = [
    "black>=23.9.1,<24.0.0",
    "isort>=5.13.2,<6.0.0",
    "pylint>=2.13.4,<3.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
]
mujoco = [
    "dm-control>=1.0.26,<2.0.0",
    "imageio>=2.36.1,<3.0.0",
]
pybullet = [
    "pybullet>=3.2.1,<4.0.0",
]
tutorials = [
    "jupyterlab>=4.0.0,<5.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "planarenvs>=1.5.1,<2.0.0",
]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
